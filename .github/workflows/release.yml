name: Release

"on":
  push:
    tags:
      - "v*.*.*"
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Verify release version
        run: node --input-type=module -e "import fs from 'node:fs'; const pkg = JSON.parse(fs.readFileSync('package.json')); if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) throw new Error('Tag and package version must match')"
      - name: Typecheck
        run: npm run typecheck
      - name: Build and test CLI
        run: npm test
      - name: Test templates
        run: npm run test:templates
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist/ directory not found after build"
            exit 1
          fi
          if [ ! -f "dist/index.js" ] && [ ! -f "dist/index.cjs" ]; then
            echo "Error: expected build artifacts not found in dist/"
            exit 1
          fi
          echo "Build artifacts verified:"
          ls -lh dist/

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""
        # 使用 OIDC Trusted Publisher 认证，不需要 NPM_TOKEN
        #
        # === 首次配置步骤 ===
        # 1. npmjs.com → 登录 → 包页面 → Settings → Trusted Publishers → 添加：
        #    - Repository owner: zixiao-labs
        #    - Repository name: create-nasti
        #    - Workflow filename: release.yml
        #    - Environment name: production
        # 2. GitHub repo → Settings → Environments → 新建 "production"
        #    （可在此环境中配置 Required reviewers 或 Deployment branches 限制）
        #
        # 注意：Trusted Publisher 使用 OIDC token 替代 NPM_TOKEN，
        # 两者是互斥的认证方式，不应同时使用。
        # --provenance 标志要求 id-token: write 权限，会在 npm 包页面显示来源验证信息。
